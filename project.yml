name: FiberNavi
options:
  bundleIdPrefix: local.fibernavi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.0.0"

targets:
  FiberNavi:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: MapLibre
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: FiberNavi
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: "Нужна геопозиция, чтобы показать вас на карте и вести по маршруту."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Геопозиция в фоне нужна, чтобы вести по маршруту при выключенном экране."
        # Временный базовый стиль до появления своего PMTiles-бэкенда (этап 2).
        FNMapStyleURL: "https://tiles.openfreemap.org/styles/liberty"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.fibernavi.app

  FiberNaviTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FiberNaviTests
    dependencies:
      - target: FiberNavi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FiberNavi:
    build:
      targets:
        FiberNavi: all
        FiberNaviTests: [test]
    test:
      targets:
        - FiberNaviTests
