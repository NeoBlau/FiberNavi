name: iOS build & test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project FiberNavi.xcodeproj \
            -scheme FiberNavi \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || exit 1

  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install pillow pyyaml
      - name: Styles are up to date
        run: python3 tools/style_builder/build_styles.py --check
      - name: Validate MapLibre styles
        run: for f in App/Themes/*/*.json; do npx --yes -p @maplibre/maplibre-gl-style-spec@26.4.4 gl-style-validate "$f"; done
      - name: Tool tests
        run: |
          python3 -m unittest tools/pack_tool/test_pack_tool.py
          python3 -m unittest tools/voice_tagger/test_voice_tagger.py

  ipa:
    runs-on: macos-15
    needs: build-test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned IPA
        run: ./scripts/build_ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FiberNavi-ipa
          path: build/FiberNavi.ipa
          retention-days: 14
